name: Apply NEXO vehicle identification v1

on:
  push:
    branches:
      - agent/nexo-vehicle-identification-v1

permissions:
  contents: write

concurrency:
  group: apply-nexo-vehicle-identification-v1
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[applied-nexo-identification-v1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/nexo-vehicle-identification-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply NEXO identification patch
        run: python tools/apply_nexo_vehicle_identification_v1.py

      - name: Run static identification check
        run: python tools/check_nexo_vehicle_identification.py

      - name: Install identification-test dependencies
        run: python -m pip install --disable-pip-version-check numpy cffi parameterized pycapnp

      - name: Run NEXO fingerprint unit tests
        working-directory: opendbc_repo
        run: python -m unittest opendbc.car.hyundai.tests.test_nexo_fingerprint

      - name: Commit generated identification changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            opendbc_repo/opendbc/car/hyundai/fingerprints.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_nexo_fingerprint.py \
            tools/check_nexo_vehicle_identification.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Restore NEXO CAN fingerprint fallback [applied-nexo-identification-v1]"
          git push origin HEAD:agent/nexo-vehicle-identification-v1
