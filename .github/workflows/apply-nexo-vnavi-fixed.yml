name: Apply NEXO vNAVI fixed

on:
  push:
    branches: [NEXO]
    paths:
      - .github/workflows/apply-nexo-vnavi-fixed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: NEXO
          fetch-depth: 0

      - name: Apply vNAVI patch
        run: python .github/scripts/apply_nexo_vnavi.py

      - name: Syntax and diff checks
        run: |
          python -m compileall -q common/nexo_vnavi.py opendbc_repo/opendbc/car/hyundai/carstate.py selfdrive/controls/lib/longitudinal_planner.py selfdrive/ui/onroad/hud_renderer.py
          git diff --check
          grep -q 'BO_ 1348 Navi_HU' opendbc_repo/opendbc/dbc/generator/hyundai/hyundai_can.dbc
          grep -q 'calculate_vnavi_target_speed' selfdrive/controls/lib/longitudinal_planner.py
          grep -q 'vNAVI' selfdrive/ui/onroad/hud_renderer.py

      - name: Commit vNAVI feature
        run: |
          git config user.name "NEXO vNAVI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add common/nexo_vnavi.py opendbc_repo/opendbc/car/hyundai/carstate.py selfdrive/controls/lib/longitudinal_planner.py selfdrive/ui/onroad/hud_renderer.py
          git rm .github/scripts/apply_nexo_vnavi.py .github/workflows/apply-nexo-vnavi.yml .github/workflows/apply-nexo-vnavi-fixed.yml
          git commit -m "feat(nexo): add Carrot-style stock vNAVI control"
          git push origin HEAD:NEXO
