name: Restore NEXO relay protection

on:
  push:
    branches:
      - agent/nexo-neutral-scc-ownership-v1

permissions:
  contents: write

concurrency:
  group: restore-nexo-relay-protection
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore relay protection
        run: python tools/restore_nexo_relay_protection.py

      - name: Commit code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Keep NEXO Panda relay protection enabled"
          git push origin HEAD:${{ github.ref_name }}
