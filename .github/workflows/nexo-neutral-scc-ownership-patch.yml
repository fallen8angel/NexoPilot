name: Apply NEXO SCC takeover patch

on:
  push:
    branches:
      - agent/nexo-neutral-scc-ownership-v1

permissions:
  contents: write

concurrency:
  group: nexo-neutral-scc-ownership-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply verified takeover patch
        run: python tools/apply_nexo_neutral_scc_ownership_patch.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Verify NEXO SCC silence before longitudinal takeover"
          git push origin HEAD:${{ github.ref_name }}
