name: NEXO validation

on:
  push:
    branches:
      - NEXO
      - "agent/**"
  pull_request:
    branches:
      - NEXO
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-nexo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply NEXO dynamic forwarding candidate
        if: github.ref_name == 'agent/nexo-dynamic-scc-forwarding' || github.head_ref == 'agent/nexo-dynamic-scc-forwarding'
        run: python tools/apply_nexo_dynamic_forwarding.py

      - name: Check NEXO integration
        run: python tools/check_nexo_integration.py

      - name: Check NEXO DBC contract
        run: python tools/check_nexo_dbc_contract.py

      - name: Export verified forwarding files
        if: github.ref_name == 'agent/nexo-dynamic-scc-forwarding' || github.head_ref == 'agent/nexo-dynamic-scc-forwarding'
        uses: actions/upload-artifact@v4
        with:
          name: nexo-dynamic-forwarding-files
          path: |
            opendbc_repo/opendbc/safety/modes/hyundai.h
            opendbc_repo/opendbc/safety/tests/test_hyundai.py
            tools/check_nexo_integration.py
          if-no-files-found: error
