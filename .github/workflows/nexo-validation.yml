name: NEXO validation

on:
  push:
    branches:
      - NEXO
      - "agent/**"
  pull_request:
    branches:
      - NEXO
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-nexo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check NEXO integration
        run: python tools/check_nexo_integration.py

      - name: Check NEXO Params registry
        run: python tools/check_nexo_param_keys.py

      - name: Check NEXO post-radar guard
        run: python tools/check_nexo_post_radar_guard.py

      - name: Check NEXO diagnostics
        run: python tools/check_nexo_diagnostics.py

      - name: Check NEXO verified SCC takeover and AI parity diagnostics
        run: python tools/check_nexo_ai_parity.py

      - name: Check NEXO cruise-only driver monitoring and port 7000
        run: python tools/check_nexo_driver_monitoring.py

      - name: Check NEXO UDS and failure policy
        run: python tools/check_nexo_uds_failure_policy.py

      - name: Check NEXO DBC contract
        run: python tools/check_nexo_dbc_contract.py

      - name: Check NEXO AI SCC ownership
        run: python tools/check_nexo_ai_scc_ownership.py

      - name: Check NEXO vehicle identification
        run: python tools/check_nexo_vehicle_identification.py

      - name: Install NEXO Panda safety test dependencies
        run: python -m pip install --disable-pip-version-check numpy cffi parameterized pycapnp

      - name: Test NEXO standard FCEV LONG safety
        working-directory: opendbc_repo
        shell: bash
        run: |
          set +e
          python -m unittest opendbc.safety.tests.test_hyundai.TestHyundaiSafetyFCEVLong 2>&1 | tee /tmp/nexo-fcev-long-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 35 /tmp/nexo-fcev-long-test.log | tr '\n' '|' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=NEXO standard FCEV LONG safety::$details"
            exit "$status"
          fi

      - name: Test NEXO post-radar SCC silence verification
        working-directory: opendbc_repo
        run: python -m unittest opendbc.car.hyundai.tests.test_nexo_takeover

      - name: Test NEXO CAN fingerprint fallback
        working-directory: opendbc_repo
        run: python -m unittest opendbc.car.hyundai.tests.test_nexo_fingerprint

      - name: Test NEXO stock SCC crash recovery
        working-directory: opendbc_repo
        run: python -m unittest opendbc.car.hyundai.tests.test_nexo_init
