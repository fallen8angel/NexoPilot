name: NEXO validation

on:
  push:
    branches:
      - NEXO
  pull_request:
    branches:
      - NEXO

permissions:
  contents: read

jobs:
  validate-nexo-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile \
            opendbc_repo/opendbc/car/hyundai/values.py \
            opendbc_repo/opendbc/car/hyundai/carstate.py \
            opendbc_repo/opendbc/car/hyundai/carcontroller.py \
            opendbc_repo/opendbc/car/hyundai/hyundaican.py \
            opendbc_repo/opendbc/car/hyundai/interface.py \
            opendbc_repo/opendbc/car/hyundai/radar_interface.py \
            opendbc_repo/opendbc/car/hyundai/tests/test_nexo_init.py \
            selfdrive/car/card.py \
            selfdrive/car/tests/test_card.py \
            selfdrive/controls/controlsd.py \
            selfdrive/controls/lib/longitudinal_planner.py \
            system/nexo_web/web.py

      - name: Check NEXO DBC contract
        run: python tools/check_nexo_dbc_contract.py

      - name: Check NEXO integration
        shell: python
        run: |
          from pathlib import Path
          import sys

          checks = []

          def read(path):
              p = Path(path)
              if not p.exists():
                  return ""
              return p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

          values = read("opendbc_repo/opendbc/car/hyundai/values.py")
          carstate = read("opendbc_repo/opendbc/car/hyundai/carstate.py")
          radar = read("opendbc_repo/opendbc/car/hyundai/radar_interface.py")
          card = read("selfdrive/car/card.py")
          launch = read("launch_openpilot.sh")
          web = read("system/nexo_web/web.py")

          checks.append(("FCEV RADAR",
              "HyundaiFlags.FCEV | HyundaiFlags.MANDO_RADAR" in values))

          checks.append(("tire stiffness",
              "tireStiffnessFactor=0.385" in values))

          checks.append(("speed",
              "minEnableSpeed=10 * CV.KPH_TO_MS" in values))

          checks.append(("gear",
              "P=0, D=5, N=6, R=7" in carstate))

          checks.append(("cruise",
              'ret.cruiseState.enabled = cp.vl["TCS13"]["ACC_REQ"] == 1' in carstate and
              'ret.cruiseState.available = cp.vl["TCS13"]["ACCEnable"] == 0' in carstate and
              "self.nexo_cruise_enabled" not in carstate and
              "self.nexo_cruise_available" not in carstate and
              "NEXO_CONTROLS_READY_FRAMES" not in carstate and
              'get_bool("ControlsReady")' not in carstate))

          checks.append(("NEXO ACC fault debounce",
              "NEXO_ACC_FAULT_DEBOUNCE_FRAMES = 100" in carstate and
              "self.nexo_acc_fault_frames" in carstate and
              "ret.accFaulted = self.nexo_acc_fault_frames >= NEXO_ACC_FAULT_DEBOUNCE_FRAMES" in carstate))

          controller = read("opendbc_repo/opendbc/car/hyundai/carcontroller.py")
          hyundaican = read("opendbc_repo/opendbc/car/hyundai/hyundaican.py")
          checks.append(("NEXO SCC activation sequence",
              "CS.out.cruiseState.available, CS.out.cruiseState.enabled" in controller and
              "acc_enabled = enabled if is_nexo else enabled and main_mode_acc" in hyundaican and
              "scc14_enabled = acc_enabled" in hyundaican))

          checks.append(("NEXO stock SCC payload preservation",
              'self.scc11 = copy.copy(cp_cruise.vl["SCC11"])' in carstate and
              'self.scc12 = copy.copy(cp_cruise.vl["SCC12"])' in carstate and
              'self.scc14 = copy.copy(cp_cruise.vl["SCC14"])' in carstate and
              "CS.scc11, CS.scc12, CS.scc14" in controller and
              "copy.copy(stock_scc11) if is_nexo and stock_scc11 else {}" in hyundaican and
              "copy.copy(stock_scc12) if is_nexo and stock_scc12 else {}" in hyundaican and
              "copy.copy(stock_scc14) if is_nexo and stock_scc14 else {}" in hyundaican))

          planner = read("selfdrive/controls/lib/longitudinal_planner.py")
          controls = read("selfdrive/controls/controlsd.py")
          log_schema = read("cereal/log.capnp")
          car_schema = read("opendbc_repo/opendbc/car/car.capnp")
          checks.append(("NEXO lead data path",
              "longitudinalPlan.leadDistance = lead_one.dRel if lead_one.status else 0.0" in planner and
              "longitudinalPlan.leadRelSpeed = lead_one.vRel if lead_one.status else 0.0" in planner and
              "hudControl.leadDistance = self.sm['longitudinalPlan'].leadDistance" in controls and
              "hudControl.leadRelSpeed = self.sm['longitudinalPlan'].leadRelSpeed" in controls and
              "leadDistance @40 :Float32;" in log_schema and
              "leadRelSpeed @41 :Float32;" in log_schema and
              "leadDistance @11: Float32;" in car_schema and
              "leadRelSpeed @12: Float32;" in car_schema))

          checks.append(("NEXO MAIN passthrough",
              "main_button_events = []" in carstate))

          checks.append(("NEXO radar 20 Hz",
              "radar_frequency = 20 if CP.carFingerprint == CAR.HYUNDAI_NEXO_1ST_GEN else 50" in radar))

          checks.append(("NEXO stock cruise recovery",
              'params.put_bool("AlphaLongitudinalEnabled", False, block=True)' in card and
              'params.put_bool("ExperimentalMode", False, block=True)' in card and
              'params.put_bool("DoReboot", True, block=True)' in card and
              '"CarParamsCache"' in card and
              "recover_nexo_stock_cruise(self.params, self.CP.carFingerprint, error)" in card))

          checks.append(("current selfdrive diagnostics",
              'sub_sock("selfdriveState"' in web and
              'sub_sock("radarState"' in web and
              'sub_sock("pandaStates"' in web and
              "LONG(4)" in web and
              "FCEV_GAS(256)" in web and
              'return "안전 차단", source - 192' in web and
              'sub_sock("controlsState"' not in web))

          interface = Path("opendbc_repo/opendbc/car/hyundai/interface.py").read_text()
          checks.append(("NEXO longitudinal toggle and Panda safety lockstep",
              "ret.openpilotLongitudinalControl = alpha_long and ret.alphaLongitudinalAvailable" in interface and
              "if ret.openpilotLongitudinalControl:" in interface and
              "ret.safetyConfigs[-1].safetyParam |= HyundaiSafetyFlags.LONG.value" in interface and
              "HyundaiSafetyFlags.LONG | HyundaiSafetyFlags.FCEV_GAS" not in interface))
          checks.append(("Carrot NEXO disable-then-radar sequence",
              interface.index("disabled = disable_ecu") <
              interface.index("tracks_enabled = enable_radar_tracks", interface.index("disabled = disable_ecu")) and
              "nexo_stock_scc_is_silent" not in interface and
              'raise RuntimeError("NEXO stock SCC communication could not be disabled")' in interface and
              'raise RuntimeError("NEXO radar track activation failed")' in interface and
              "retries=3" in interface))

          checks.append(("apply removed",
              "apply_nexo_ai.py" not in launch))

          checks.append(("skip fw removed",
              "SKIP_FW_QUERY" not in launch))

          checks.append(("auth",
              "def _require_auth" in web))

          checks.append(("same origin",
              "def _same_origin" in web))

          checks.append(("request body",
              "MAX_REQUEST_BODY" in web))

          checks.append(("old patch removed",
              not Path("tools/apply_nexo_ai.py").exists()))

          failed = False

          for name, result in checks:
              print(name, "OK" if result else "FAIL")
              if not result:
                  failed = True

          if failed:
              sys.exit(1)

          print("NEXO validation PASS")
