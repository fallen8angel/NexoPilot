name: NEXO validation

on:
  push:
    branches:
      - NEXO
      - "agent/**"
  pull_request:
    branches:
      - NEXO
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-nexo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check NEXO integration
        run: python tools/check_nexo_integration.py

      - name: Check NEXO DBC contract
        run: python tools/check_nexo_dbc_contract.py

      - name: Install opendbc safety test dependencies
        run: python -m pip install cffi numpy pycapnp tqdm pycryptodome

      - name: Compile and test NEXO FCEV safety forwarding
        run: PYTHONPATH=opendbc_repo python -m unittest opendbc.safety.tests.test_hyundai.TestHyundaiSafetyFCEVLong
