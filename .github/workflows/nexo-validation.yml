name: NEXO validation

on:
  push:
    branches: [NEXO]
  pull_request:
    branches: [NEXO]

permissions:
  contents: read

jobs:
  validate-nexo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            opendbc_repo/opendbc/car/hyundai/values.py \
            opendbc_repo/opendbc/car/hyundai/carstate.py \
            system/nexo_web/web.py

      - name: Check NEXO integration diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          checks = []

          def read_file(path):
              p = Path(path)
              if not p.exists():
                  return None
              return p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

          values = read_file("opendbc_repo/opendbc/car/hyundai/values.py")
          carstate = read_file("opendbc_repo/opendbc/car/hyundai/carstate.py")
          launch = read_file("launch_openpilot.sh")
          web = read_file("system/nexo_web/web.py")

          def check(name, result):
              checks.append((name, bool(result)))

          check("values.py", values is not None)
          check("carstate.py", carstate is not None)
          check("launch", launch is not None)
          check("web.py", web is not None)

          check("FCEV RADAR",
                values and "HyundaiFlags.FCEV | HyundaiFlags.MANDO_RADAR" in values)

          check("tire",
                values and "tireStiffnessFactor=0.385" in values)

          check("speed",
                values and "minEnableSpeed=10 * CV.KPH_TO_MS" in values)

          check("gear",
                carstate and "P=0, D=5, N=6, R=7" in carstate)

          check("cruise",
                carstate and "self.nexo_cruise_enabled" in carstate)

          check("apply removed",
                launch and "apply_nexo_ai.py" not in launch)

          check("skip fw removed",
                launch and "SKIP_FW_QUERY" not in launch)

          check("auth",
                web and "def _require_auth" in web)

          check("same origin",
                web and "def _same_origin" in web)

          check("body",
                web and "MAX_REQUEST_BODY" in web)

          check("old patch removed",
                not Path("tools/apply_nexo_ai.py").exists())

          failed = False

          for name, result in checks:
              print(name, "OK" if result else "FAIL")
              if not result:
                  failed = True

          if failed:
              sys.exit(1)

          print("NEXO validation PASS")
          PY