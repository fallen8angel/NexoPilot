name: NEXO validation

on:
  push:
    branches:
      - NEXO
  pull_request:
    branches:
      - NEXO

permissions:
  contents: read

jobs:
  validate-nexo-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile \
            opendbc_repo/opendbc/car/hyundai/values.py \
            opendbc_repo/opendbc/car/hyundai/carstate.py \
            system/nexo_web/web.py

      - name: Check NEXO integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          def read(path):
              p = Path(path)
              if not p.exists():
                  return ""
              return p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

          values = read("opendbc_repo/opendbc/car/hyundai/values.py")
          carstate = read("opendbc_repo/opendbc/car/hyundai/carstate.py")
          launch = read("launch_openpilot.sh")
          web = read("system/nexo_web/web.py")

          checks = [
              ("FCEV RADAR",
               "HyundaiFlags.FCEV | HyundaiFlags.MANDO_RADAR" in values),

              ("tire stiffness",
               "tireStiffnessFactor=0.385" in values),

              ("speed",
               "minEnableSpeed=10 * CV.KPH_TO_MS" in values),

              ("gear",
               "P=0, D=5, N=6, R=7" in carstate),

              ("cruise",
               "self.nexo_cruise_enabled" in carstate),

              ("apply removed",
               "apply_nexo_ai.py" not in launch),

              ("skip fw removed",
               "SKIP_FW_QUERY" not in launch),

              ("auth",
               "def _require_auth" in web),

              ("same origin",
               "def _same_origin" in web),

              ("request body",
               "MAX_REQUEST_BODY" in web),

              ("old patch removed",
               not Path("tools/apply_nexo_ai.py").exists())
          ]

          failed = False

          for name, result in checks:
              print(name, "OK" if result else "FAIL")
              if not result:
                  failed = True

          if failed:
              sys.exit(1)

          print("NEXO validation PASS")
          PY