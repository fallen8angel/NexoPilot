name: NEXO validation

on:
  push:
    branches:
      - NEXO
  pull_request:
    branches:
      - NEXO

permissions:
  contents: read

jobs:
  validate-nexo-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile \
            opendbc_repo/opendbc/car/hyundai/values.py \
            opendbc_repo/opendbc/car/hyundai/carstate.py \
            opendbc_repo/opendbc/car/hyundai/radar_interface.py \
            selfdrive/car/card.py \
            selfdrive/car/tests/test_card.py \
            system/nexo_web/web.py

      - name: Check NEXO integration
        shell: python
        run: |
          from pathlib import Path
          import sys

          checks = []

          def read(path):
              p = Path(path)
              if not p.exists():
                  return ""
              return p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

          values = read("opendbc_repo/opendbc/car/hyundai/values.py")
          carstate = read("opendbc_repo/opendbc/car/hyundai/carstate.py")
          radar = read("opendbc_repo/opendbc/car/hyundai/radar_interface.py")
          card = read("selfdrive/car/card.py")
          launch = read("launch_openpilot.sh")
          web = read("system/nexo_web/web.py")

          checks.append(("FCEV RADAR",
              "HyundaiFlags.FCEV | HyundaiFlags.MANDO_RADAR" in values))

          checks.append(("tire stiffness",
              "tireStiffnessFactor=0.385" in values))

          checks.append(("speed",
              "minEnableSpeed=10 * CV.KPH_TO_MS" in values))

          checks.append(("gear",
              "P=0, D=5, N=6, R=7" in carstate))

          checks.append(("cruise",
              'ret.cruiseState.enabled = cp.vl["TCS13"]["ACC_REQ"] == 1' in carstate and
              'ret.cruiseState.available = cp.vl["TCS13"]["ACCEnable"] == 0 and nexo_controls_ready' in carstate and
              "self.nexo_cruise_enabled" not in carstate and
              "self.nexo_cruise_available" not in carstate))

          checks.append(("cruise readiness",
              "NEXO_CONTROLS_READY_FRAMES = 200" in carstate and
              'get_bool("ControlsReady")' in carstate))

          controller = read("opendbc_repo/opendbc/car/hyundai/carcontroller.py")
          hyundaican = read("opendbc_repo/opendbc/car/hyundai/hyundaican.py")
          checks.append(("NEXOdriveAI SCC activation sequence",
              "CS.out.cruiseState.available, CS.out.cruiseState.enabled" in controller and
              "vehicle_cruise_enabled if is_nexo else main_mode_acc" in hyundaican and
              "scc14_enabled = enabled if is_nexo else acc_enabled" in hyundaican))

          checks.append(("NEXO MAIN passthrough",
              "main_button_events = []" in carstate))

          checks.append(("NEXO radar 20 Hz",
              "radar_frequency = 20 if CP.carFingerprint == CAR.HYUNDAI_NEXO_1ST_GEN else 50" in radar))

          checks.append(("NEXO stock cruise recovery",
              'params.put_bool("AlphaLongitudinalEnabled", False, block=True)' in card and
              'params.put_bool("ExperimentalMode", False, block=True)' in card and
              "recover_nexo_stock_cruise(self.params, self.CP.carFingerprint, error)" in card))

          checks.append(("current selfdrive diagnostics",
              'sub_sock("selfdriveState"' in web and
              'sub_sock("radarState"' in web and
              'sub_sock("pandaStates"' in web and
              "LONG(4)" in web and
              "FCEV_GAS(256)" in web and
              'return "안전 차단", source - 192' in web and
              'sub_sock("controlsState"' not in web))

          interface = Path("opendbc_repo/opendbc/car/hyundai/interface.py").read_text()
          checks.append(("NEXO longitudinal toggle and Panda safety lockstep",
              "ret.openpilotLongitudinalControl = alpha_long and ret.alphaLongitudinalAvailable" in interface and
              "if ret.openpilotLongitudinalControl:" in interface and
              "ret.safetyConfigs[-1].safetyParam |= HyundaiSafetyFlags.LONG.value" in interface and
              "HyundaiSafetyFlags.LONG | HyundaiSafetyFlags.FCEV_GAS" not in interface))
          checks.append(("NEXO radar configure before SCC silence",
              interface.index("if not enable_radar_tracks") <
              interface.index("disable_sent = disable_ecu", interface.index("if not enable_radar_tracks")) and
              "nexo_stock_scc_is_silent" in interface and
              "NEXO stock SCC silence verified" in interface and
              "NEXO stock SCC remained active; longitudinal control not started" in interface))

          checks.append(("apply removed",
              "apply_nexo_ai.py" not in launch))

          checks.append(("skip fw removed",
              "SKIP_FW_QUERY" not in launch))

          checks.append(("auth",
              "def _require_auth" in web))

          checks.append(("same origin",
              "def _same_origin" in web))

          checks.append(("request body",
              "MAX_REQUEST_BODY" in web))

          checks.append(("old patch removed",
              not Path("tools/apply_nexo_ai.py").exists()))

          failed = False

          for name, result in checks:
              print(name, "OK" if result else "FAIL")
              if not result:
                  failed = True

          if failed:
              sys.exit(1)

          print("NEXO validation PASS")
