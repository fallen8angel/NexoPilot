name: Apply NEXO UDS logging fix

on:
  push:
    branches:
      - agent/fix-nexo-uds-log-no-auto-reboot
  pull_request:
    branches:
      - NEXO
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-nexo-uds-no-auto-reboot
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-nexo-uds-log-no-auto-reboot
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        run: python tools/apply_nexo_uds_no_auto_reboot.py

      - name: Validate
        run: |
          python -m py_compile \
            opendbc_repo/opendbc/car/hyundai/radar_tracks.py \
            selfdrive/car/card.py \
            selfdrive/car/nexo_guard.py \
            system/nexo_web/nexo_diagnostics_v2.py
          python tools/check_nexo_uds_failure_policy.py
          python tools/check_nexo_integration.py
          python tools/check_nexo_post_radar_guard.py
          python tools/check_nexo_diagnostics.py
          python tools/check_nexo_dbc_contract.py

      - name: Commit generated changes
        run: |
          git config user.name "NexoPilot CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            opendbc_repo/opendbc/car/hyundai/radar_tracks.py \
            selfdrive/car/card.py \
            selfdrive/car/nexo_guard.py \
            system/nexo_web/nexo_diagnostics_v2.py \
            tools/check_nexo_integration.py
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Fix NEXO UDS logging without auto reboot"
          git push origin HEAD:agent/fix-nexo-uds-log-no-auto-reboot
