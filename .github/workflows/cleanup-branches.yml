name: Cleanup non-NEXO branches

on:
  push:
    branches: [NEXO]
    paths:
      - '.github/workflows/cleanup-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'chore: remove branch cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete every remote branch except NEXO
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "NEXO" ] && continue
            echo "Deleting $branch"
            git push origin --delete "$branch"
          done < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')

      - name: Remove temporary cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup-branches.yml
          git commit -m "chore: remove branch cleanup workflow"
          git push origin HEAD:NEXO
