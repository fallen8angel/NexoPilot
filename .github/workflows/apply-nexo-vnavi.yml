name: Apply NEXO vNAVI

on:
  push:
    branches: [NEXO]
    paths:
      - .github/workflows/apply-nexo-vnavi.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: NEXO
          fetch-depth: 0

      - name: Apply NEXO stock-navigation vNAVI support
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
            p = Path(path)
            text = p.read_text()
            if old not in text:
              raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
            if text.count(old) != 1:
              raise SystemExit(f"anchor count != 1 in {path}: {text.count(old)}")
            p.write_text(text.replace(old, new, 1))

          common = Path("common/nexo_vnavi.py")
          common.write_text('''import math
import os
import time


VNAVI_STATE_PATH = "/dev/shm/nexopilot_vnavi"
VNAVI_STATE_MAX_AGE = 0.75
VNAVI_VIRTUAL_DISTANCE_FACTOR = 6.0
VNAVI_SAFE_TIME = 6.0
VNAVI_DECEL_RATE = 1.2


def write_vnavi_state(active: bool, speed_limit_kph: float, distance_m: float) -> None:
  """Publish stock-navigation state through tmpfs without touching persistent Params."""
  tmp_path = f"{VNAVI_STATE_PATH}.{os.getpid()}.tmp"
  try:
    with open(tmp_path, "w", encoding="utf-8") as f:
      f.write(f"{time.monotonic():.3f},{1 if active else 0},{float(speed_limit_kph):.1f},{max(0.0, float(distance_m)):.1f}\\n")
    os.replace(tmp_path, VNAVI_STATE_PATH)
  except OSError:
    try:
      os.unlink(tmp_path)
    except OSError:
      pass


def read_vnavi_state(max_age: float = VNAVI_STATE_MAX_AGE):
  """Return (active, speed_limit_kph, distance_m) or None when stale/unavailable."""
  try:
    with open(VNAVI_STATE_PATH, encoding="utf-8") as f:
      parts = f.read(128).strip().split(",")
    if len(parts) != 4:
      return None
    stamp = float(parts[0])
    age = time.monotonic() - stamp
    if age < 0.0 or age > max_age:
      return None
    active = int(parts[1]) != 0
    speed_limit_kph = float(parts[2])
    distance_m = max(0.0, float(parts[3]))
    return active, speed_limit_kph, distance_m
  except (OSError, ValueError):
    return None


def calculate_vnavi_target_speed(distance_m: float, speed_limit_kph: float,
                                  safe_time: float = VNAVI_SAFE_TIME,
                                  decel_rate: float = VNAVI_DECEL_RATE) -> float:
  """Carrot-style distance-based target speed for a stock-navigation camera."""
  if speed_limit_kph <= 0.0 or distance_m < 0.0:
    return 250.0
  safe_speed = speed_limit_kph / 3.6
  safe_dist = safe_speed * max(0.0, safe_time)
  decel_dist = max(0.0, distance_m - safe_dist)
  target_mps = math.sqrt(max(0.0, safe_speed * safe_speed + 2.0 * max(0.0, decel_rate) * decel_dist))
  return max(speed_limit_kph, min(250.0, target_mps * 3.6))
''')

          carstate = "opendbc_repo/opendbc/car/hyundai/carstate.py"
          replace_once(
            carstate,
            "from opendbc.car.interfaces import CarStateBase\nButtonType = structs.CarState.ButtonEvent.Type\n",
            "from opendbc.car.interfaces import CarStateBase\nfrom openpilot.common.nexo_vnavi import VNAVI_VIRTUAL_DISTANCE_FACTOR, write_vnavi_state\nButtonType = structs.CarState.ButtonEvent.Type\n",
          )
          replace_once(
            carstate,
            "    self.scc11 = {}\n    self.scc12 = {}\n    self.scc14 = {}\n\n  def recent_button_interaction(self) -> bool:\n",
            "    self.scc11 = {}\n    self.scc12 = {}\n    self.scc14 = {}\n\n    # NEXO stock-navigation camera state (Navi_HU / CAN 0x544).\n    # Exact event distance is not exposed on this generation, so use the same\n    # speed-based virtual-distance fallback used by Carrot until a distance CAN is validated.\n    self.vnavi_total_distance = 0.0\n    self.vnavi_target_distance = 0.0\n    self.vnavi_active = False\n    self.vnavi_speed = 0\n    self.vnavi_publish_counter = 0\n\n  def _update_vnavi(self, cp, ret) -> None:\n    self.vnavi_total_distance += max(0.0, ret.vEgo) * 0.01\n    navi = cp.vl[\"Navi_HU\"]\n    speed_limit = int(navi[\"SpeedLim_Nav_Clu\"])\n    camera_active = int(navi[\"SpeedLim_Nav_Cam\"]) == 1 and 0 < speed_limit < 255\n\n    was_active = self.vnavi_active\n    old_speed = self.vnavi_speed\n    if camera_active:\n      if not self.vnavi_active or speed_limit != self.vnavi_speed:\n        self.vnavi_target_distance = self.vnavi_total_distance + speed_limit * VNAVI_VIRTUAL_DISTANCE_FACTOR\n      self.vnavi_active = True\n      self.vnavi_speed = speed_limit\n      distance = max(0.0, self.vnavi_target_distance - self.vnavi_total_distance)\n    else:\n      self.vnavi_active = False\n      self.vnavi_speed = 0\n      self.vnavi_target_distance = self.vnavi_total_distance\n      distance = 0.0\n\n    # Publish at 10 Hz, plus immediately on activation/deactivation or limit changes.\n    self.vnavi_publish_counter += 1\n    state_changed = was_active != self.vnavi_active or old_speed != self.vnavi_speed\n    if state_changed or self.vnavi_publish_counter >= 10:\n      write_vnavi_state(self.vnavi_active, self.vnavi_speed, distance)\n      self.vnavi_publish_counter = 0\n\n  def recent_button_interaction(self) -> bool:\n",
          )
          replace_once(
            carstate,
            "    ret.lowSpeedAlert = self.low_speed_alert\n    return ret\n\n  def update_canfd",
            "    ret.lowSpeedAlert = self.low_speed_alert\n\n    if self.CP.carFingerprint == CAR.HYUNDAI_NEXO_1ST_GEN:\n      self._update_vnavi(cp, ret)\n    return ret\n\n  def update_canfd",
          )
          replace_once(
            carstate,
            "    return {\n      Bus.pt: CANParser(DBC[CP.carFingerprint][Bus.pt], [], 0),\n      Bus.cam: CANParser(DBC[CP.carFingerprint][Bus.pt], [], 2),\n    }",
            "    pt_msgs = [(\"Navi_HU\", math.nan)] if CP.carFingerprint == CAR.HYUNDAI_NEXO_1ST_GEN else []\n    return {\n      Bus.pt: CANParser(DBC[CP.carFingerprint][Bus.pt], pt_msgs, 0),\n      Bus.cam: CANParser(DBC[CP.carFingerprint][Bus.pt], [], 2),\n    }",
          )

          planner = "selfdrive/controls/lib/longitudinal_planner.py"
          replace_once(
            planner,
            "from openpilot.common.filter_simple import FirstOrderFilter\n",
            "from openpilot.common.filter_simple import FirstOrderFilter\nfrom openpilot.common.nexo_vnavi import calculate_vnavi_target_speed, read_vnavi_state\n",
          )
          replace_once(
            planner,
            "    self.output_a_target = 0.0\n    self.output_should_stop = False\n\n    self.v_desired_trajectory",
            "    self.output_a_target = 0.0\n    self.output_should_stop = False\n    self.vnavi_active = False\n    self.vnavi_speed_limit = 0.0\n    self.vnavi_distance = 0.0\n\n    self.v_desired_trajectory",
          )
          replace_once(
            planner,
            "    v_cruise_initialized = sm['carState'].vCruise != V_CRUISE_UNSET\n\n    long_control_off",
            "    v_cruise_initialized = sm['carState'].vCruise != V_CRUISE_UNSET\n\n    # NEXO vNAVI: cap the cruise target with the stock-navigation camera curve.\n    # This only influences openpilot longitudinal control; stock cruise behavior is untouched.\n    vnavi_state = read_vnavi_state() if self.CP.openpilotLongitudinalControl else None\n    self.vnavi_active = bool(vnavi_state and vnavi_state[0])\n    if self.vnavi_active:\n      self.vnavi_speed_limit = vnavi_state[1]\n      self.vnavi_distance = vnavi_state[2]\n      vnavi_target_kph = calculate_vnavi_target_speed(self.vnavi_distance, self.vnavi_speed_limit)\n      v_cruise = min(v_cruise, vnavi_target_kph * CV.KPH_TO_MS)\n    else:\n      self.vnavi_speed_limit = 0.0\n      self.vnavi_distance = 0.0\n\n    long_control_off",
          )

          hud = "selfdrive/ui/onroad/hud_renderer.py"
          replace_once(
            hud,
            "from openpilot.common.constants import CV\n",
            "from openpilot.common.constants import CV\nfrom openpilot.common.nexo_vnavi import read_vnavi_state\n",
          )
          replace_once(
            hud,
            "  exp_badge: int = 34\n  gear: int = 70\n",
            "  exp_badge: int = 34\n  vnavi: int = 36\n  gear: int = 70\n",
          )
          replace_once(
            hud,
            "  EXP_ACTIVE = rl.Color(128, 216, 166, 245)\n",
            "  EXP_ACTIVE = rl.Color(128, 216, 166, 245)\n  VNAVI = rl.Color(210, 165, 255, 255)\n",
          )
          replace_once(
            hud,
            "    self.experimental_mode: bool = False\n    self.gear_text: str = \"–\"\n",
            "    self.experimental_mode: bool = False\n    self.gear_text: str = \"–\"\n    self.vnavi_active: bool = False\n    self.vnavi_speed_limit: float = 0.0\n    self.vnavi_distance: float = 0.0\n",
          )
          replace_once(
            hud,
            "      self.gear_text = \"–\"\n      return\n",
            "      self.gear_text = \"–\"\n      self.vnavi_active = False\n      self.vnavi_speed_limit = 0.0\n      self.vnavi_distance = 0.0\n      return\n",
          )
          replace_once(
            hud,
            "    self.gear_text = self._gear_label(car_state.gearShifter)\n\n  def _render",
            "    self.gear_text = self._gear_label(car_state.gearShifter)\n\n    vnavi_state = read_vnavi_state()\n    self.vnavi_active = bool(vnavi_state and vnavi_state[0])\n    if self.vnavi_active:\n      self.vnavi_speed_limit = vnavi_state[1]\n      self.vnavi_distance = vnavi_state[2]\n    else:\n      self.vnavi_speed_limit = 0.0\n      self.vnavi_distance = 0.0\n\n  def _render",
          )
          replace_once(
            hud,
            "    self._draw_current_speed(rect)\n    self._draw_turn_indicators(rect)\n",
            "    self._draw_current_speed(rect)\n    self._draw_vnavi(rect)\n    self._draw_turn_indicators(rect)\n",
          )
          replace_once(
            hud,
            "  def _draw_turn_indicators(self, rect: rl.Rectangle) -> None:\n",
            "  def _draw_vnavi(self, rect: rl.Rectangle) -> None:\n    if not self.vnavi_active:\n      return\n    speed = round(self.vnavi_speed_limit)\n    distance = round(self.vnavi_distance)\n    text = f\"vNAVI {speed} · {distance}m\"\n    text_size = measure_text_cached(self._font_semi_bold, text, FONT_SIZES.vnavi)\n    x = rect.x + rect.width / 2 - text_size.x / 2\n    y = rect.y + 326\n    rl.draw_text_ex(self._font_semi_bold, text, rl.Vector2(x, y), FONT_SIZES.vnavi, 0, COLORS.VNAVI)\n\n  def _draw_turn_indicators(self, rect: rl.Rectangle) -> None:\n",
          )

      - name: Syntax and diff checks
        run: |
          python -m compileall -q common/nexo_vnavi.py opendbc_repo/opendbc/car/hyundai/carstate.py selfdrive/controls/lib/longitudinal_planner.py selfdrive/ui/onroad/hud_renderer.py
          git diff --check
          grep -q 'Navi_HU' opendbc_repo/opendbc/dbc/generator/hyundai/hyundai_can.dbc
          grep -q 'calculate_vnavi_target_speed' selfdrive/controls/lib/longitudinal_planner.py
          grep -q 'vNAVI' selfdrive/ui/onroad/hud_renderer.py

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "NEXO vNAVI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add common/nexo_vnavi.py opendbc_repo/opendbc/car/hyundai/carstate.py selfdrive/controls/lib/longitudinal_planner.py selfdrive/ui/onroad/hud_renderer.py
          git rm .github/workflows/apply-nexo-vnavi.yml
          git commit -m "feat(nexo): add Carrot-style stock vNAVI control"
          git push origin HEAD:NEXO
