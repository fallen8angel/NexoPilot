name: Apply NEXO stock SCC crash recovery

on:
  push:
    branches:
      - agent/nexo-stock-scc-crash-recovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Apply NEXO stock SCC crash recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/nexo-stock-scc-crash-recovery
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply_nexo_stock_scc_crash_recovery.py

      - name: Run static validation
        run: |
          python tools/check_nexo_integration.py
          python tools/check_nexo_param_keys.py
          python tools/check_nexo_post_radar_guard.py
          python tools/check_nexo_diagnostics.py
          python tools/check_nexo_uds_failure_policy.py
          python tools/check_nexo_dbc_contract.py
          python tools/check_nexo_ai_scc_ownership.py
          python tools/check_nexo_vehicle_identification.py

      - name: Commit applied code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/nexo-validation.yml \
                  opendbc_repo/opendbc/car/hyundai/interface.py \
                  opendbc_repo/opendbc/car/hyundai/tests/test_nexo_init.py \
                  selfdrive/car/card.py \
                  system/nexo_web/nexo_diagnostics_v2.py \
                  tools/check_nexo_integration.py \
                  tools/check_nexo_uds_failure_policy.py
          git diff --cached --check
          git commit -m "Apply NEXO stock SCC crash recovery"
          git push origin HEAD:agent/nexo-stock-scc-crash-recovery
